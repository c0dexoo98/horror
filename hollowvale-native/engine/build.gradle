plugins { id 'com.android.library' }

android {
    namespace 'com.hollowengine'
    compileSdk 34

    defaultConfig {
        minSdk 24
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

// The engine is 100% pure Java + android.* SDK — zero third-party dependencies.
dependencies {
}
