plugins { id 'com.android.application' }

android {
    namespace 'ir.hollowvale'
    compileSdk 34

    defaultConfig {
        applicationId "ir.hollowvale"
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName "4.0.0"
    }

    signingConfigs {
        release {
            storeFile file('../hv.keystore')
            storePassword 'hollowvale'
            keyAlias 'hv'
            keyPassword 'hollowvale'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
