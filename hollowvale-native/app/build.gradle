plugins { id 'com.android.application' }

android {
    namespace 'ir.hollowvale'
    compileSdk 34

    defaultConfig {
        applicationId "ir.hollowvale"
        minSdk 24
        targetSdk 34
        versionCode 9
        versionName "6.0.0"
    }

    signingConfigs {
        release {
            storeFile file('../hv.keystore')
            storePassword 'hollowvale'
            keyAlias 'hv'
            keyPassword 'hollowvale'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

// HOLLOW VALE v6 runs on the HollowEngine framework (github.com/c0dexoo98/HollowEngine).
// engine/ is a vendored snapshot of that repo — see engine/VERSION.txt.
dependencies {
    implementation project(':engine')
}
